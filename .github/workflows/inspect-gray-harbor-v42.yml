name: Inspect Gray Harbor V4.2 structure

on:
  push:
    paths:
      - '.github/workflows/inspect-gray-harbor-v42.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Markdown structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('灰港_黑潮王座_V4.2_AI_GM主线状态机与支线条件版.md')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          print(f'FILE_SIZE_BYTES={p.stat().st_size}')
          print(f'LINE_COUNT={len(lines)}')
          print('=== HEADINGS ===')
          for i, line in enumerate(lines, 1):
              s = line.lstrip()
              if s.startswith('#'):
                  level = len(s) - len(s.lstrip('#'))
                  if level <= 4 and len(s) > level and s[level:level+1] == ' ':
                      print(f'{i:05d}|{s}')
          print('=== KEYWORD CONTEXT ===')
          keys = ['主线状态', '九幕', '支线', '36个月', '时间轴', 'QUEST_STATUS', 'POWER_M1', '建议篇幅', '重开', '第七日', '第八日']
          for key in keys:
              hits = [(i, line) for i, line in enumerate(lines, 1) if key in line]
              print(f'--- {key} ({len(hits)}) ---')
              for i, line in hits[:80]:
                  print(f'{i:05d}|{line[:300]}')
          PY
