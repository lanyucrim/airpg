name: Merge Gray Harbor V4.4 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-gray-harbor-v44-once.yml'

permissions:
  contents: write

jobs:
  merge-v44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single authoritative V4.4 scenario document
        shell: bash
        run: |
          python - <<'PY'
