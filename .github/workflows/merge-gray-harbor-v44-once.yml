              categories.append(parts)

          assert len(categories) == 150, len(categories)

          daily_header = '''
          # V4.4 新增：150 条日常支线模板库

          > 本节属于 **G（Generator/Template）层**。DL001—DL150 只是可实例化模板，不因为写在这里就已经发生，也不因为条件满足就自动进入玩家任务列表。
          >
          > **日常支线的目的不是填满时间，而是让“生活本身”有足够多的可玩变化。** 一个游戏日允许 0 条日常支线暴露给玩家；默认最多自然暴露 1—2 条。只有玩家主动寻找工作、连续逛市场、挨家拜访、参加大型公开活动等行为，才可以在同一天接触更多候选。
          >
          > 日常支线不得为了“有内容”自动转化为犯罪、阴谋、主线线索、关键人物登场或大额奖励。`没有找到工作 / 等了一下午 / 东西就是丢了 / 对方自己解决 / 检查结果正常 / 只是记错了` 都是合法结算。
          >
          > 每条使用与其他支线兼容的：`FORMATION_CONDITIONS / PLAYER_EXPOSURE_CHANNELS / PLAYER_ENTRY_ACTIONS / BACKGROUND_ACTORS / ESCALATION_CONDITIONS / EXPIRATION_CONDITIONS / MAIN_EVIDENCE`。只有真正被世界事件实例化后，才从 G 进入 C1。

          ## 日常支线运行限制

          1. **不刷任务**：不能因为玩家一整天没有主线进展，就自动生成日常支线补偿。
          2. **不保证收益**：绝大多数只改变时间、少量金钱、体力、物品耐久、生活便利、熟悉度、普通好感或记忆。
          3. **允许后台解决**：玩家没参与时，雇主会找到别人、邻居会自己和解、丢物可能被别人捡到、活动会照常结束。
          4. **允许失败与白用工**：找不到工作、修坏东西、问了一圈没人知道、等人没等到，都可正常结束。
          5. **同类可复用但不复制事实**：例如“短工”模板可再次实例化，但每次雇主、工资、地点、班次和结果必须来自当时世界状态。
          6. **小事保持小事**：除非后续独立事实形成升级链，否则普通漏水、迟到、争吵、感冒、错信、坏鞋不会长成主线。
          7. **玩家主动追世界不受限制**：玩家若主动连续工作、逛店、拜访、参加活动，可以自己制造丰富日常，而不是等待 GM 投喂。
          '''

          blocks = [daily_header.strip()]
          for idx, (cat, title, formation, escalation, expiry, outcome) in enumerate(categories, start=1):
              d = category_defaults[cat]
              blocks.append(f'''# DL{idx:03d}｜{title}\n\n**类型**：{cat}。\n\n**FORMATION_CONDITIONS**：{formation}\n\n**PLAYER_EXPOSURE_CHANNELS**：{d['exposure']}\n\n**PLAYER_ENTRY_ACTIONS**：{d['actions']}\n\n**BACKGROUND_ACTORS**：{d['background']}\n\n**ESCALATION_CONDITIONS**：{escalation}\n\n**EXPIRATION_CONDITIONS**：{expiry}\n\n**结果方向**：{outcome}\n\n**MAIN_EVIDENCE**：{d['evidence']}''')

          daily = '\n\n---\n\n'.join(blocks)
          assert daily.count('# DL') == 150
          assert '# DL001｜' in daily and '# DL150｜' in daily

          header = '''# 《灰港：黑潮王座》V4.4 单一权威整合版

> **唯一作者剧本源**：自本版生成后，仓库中 V4.2 正文、V4.3 慢节奏修订、V4.3 新增支线扩展包与旧“当前权威剧本”索引均由本文件取代。
>
> **整合原则**：V4.2 的人物、地点、组织、历史、关键道具、关系网、调查事实、既有主支线素材全部原文保留；V4.3 的慢节奏、条件驱动、自由生活和主支线形成规则全部原文保留；V4.3 新增支线全部原文保留；V4.4 再加入 150 条日常支线模板。
>
> **冲突优先级**：本文件最前面的“V4.4 运行总则 / V4.3 慢节奏条件驱动原文”对后文继承的旧硬时间推进语句拥有覆盖权。后文出现的 `V4.2`、`V4.3` 字样只表示原始来源标签，不再代表独立权威版本。
>
> **玩法方向**：时间推动世界，不自动推动玩家剧情；玩家可以长期工作、休息、购物、社交、探索、失败、等待和浪费时间；主线、支线和日常事件必须由可追溯条件形成。世界不会等玩家，但也不会为了惩罚“不跑主线”而追着玩家制造事故。

---

# 第一编：V4.4 最高运行规则——慢节奏、条件驱动与自由生活

> 下方完整保留 V4.3 慢节奏条件驱动文本。若其规则与后文继承的 V4.2 固定月份/固定入幕规则冲突，以本编为准。
'''

          inherited = '''
---

# 第二编：完整世界基底、人物、地点、组织、历史与既有剧情资料

> 下方完整嵌入原 V4.2 作者正文，不删人物、不删地点、不删组织、不删物品、不删关系、不删调查事实、不删既有主支线素材。其内部旧版版本号保留用于来源核对；涉及“某月必须进入某幕 / 到期必须让玩家遇见某事件 / 自由时间是插入支线窗口”等旧节奏规则时，由第一编覆盖。
'''

          ext_intro = '''
---

# 第三编：既有新增支线整合

> 下方完整嵌入原 V4.3 新增支线扩展包。其支线仍先作为世界冲突/模板存在，玩家是否知道由真实暴露渠道决定。
'''

          daily_intro = '''
---

# 第四编：V4.4 日常生活支线库

> 这一编补足“没有主线也能过很多天”的实际可玩内容。它与前述支线一样不是任务列表，而是世界在满足条件时可实例化的生活事件池。
'''

          final = '\n\n'.join([
              header.strip(),
              slow,
              inherited.strip(),
              v42,
              ext_intro.strip(),
              ext,
              daily_intro.strip(),
              daily,
          ]) + '\n'

          # Final merge verification: the three source documents are preserved byte-for-byte as substrings.
          assert v42 in final
          assert slow in final
          assert ext in final
          assert final.count('# DL') == 150
          assert len(final.encode('utf-8')) > len(v42.encode('utf-8')) + len(slow.encode('utf-8')) + len(ext.encode('utf-8')) + 50000

          out_path.write_text(final, encoding='utf-8', newline='\n')

          # Remove only superseded author scenario documents. Runtime/code/catalog files are intentionally untouched.
          for p in (v42_path, slow_path, ext_path, index_path):
              if p.exists():
                  p.unlink()

          print('V4.4 bytes:', len(final.encode('utf-8')))
          print('Daily sidequests:', final.count('# DL'))
          print('Preserved V4.2:', v42 in final)
          print('Preserved slow V4.3:', slow in final)
          print('Preserved V4.3 sidequests:', ext in final)
          PY

