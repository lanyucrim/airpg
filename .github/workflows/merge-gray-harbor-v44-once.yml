          v42_path = root / '灰港_黑潮王座_V4.2_AI_GM主线状态机与支线条件版.md'
          slow_path = root / '灰港_黑潮王座_V4.3_慢节奏条件驱动版.md'
          ext_path = root / '灰港_黑潮王座_V4.3_新增支线扩展包.md'
          index_path = root / '灰港_当前权威剧本.md'
          out_path = root / '灰港_黑潮王座_V4.4_单一权威整合版.md'

          v42 = v42_path.read_text(encoding='utf-8')
          slow = slow_path.read_text(encoding='utf-8')
          ext = ext_path.read_text(encoding='utf-8')

          # Hard integrity checks against the source documents currently in main.
          assert len(v42.encode('utf-8')) == 1820565, len(v42.encode('utf-8'))
          assert len(slow.encode('utf-8')) == 18251, len(slow.encode('utf-8'))
          assert len(ext.encode('utf-8')) == 20357, len(ext.encode('utf-8'))
