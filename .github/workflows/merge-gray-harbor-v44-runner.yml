name: Run Gray Harbor V4.4 merge

on:
  push:
    paths:
      - ".github/workflows/merge-gray-harbor-v44-runner.yml"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and run V4.4 document builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/merge-gray-harbor-v44-once.yml').read_text(encoding='utf-8')
          start_marker = "          from pathlib import Path\n"
          end_marker = "\n          PY\n\n      - name: Commit merged scenario only"
          start = src.index(start_marker)
          end = src.index(end_marker, start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/build_v44.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/build_v44.py

      - name: Commit merged scenario documents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '灰港_黑潮王座_V4.4_单一权威整合版.md' \
                    '灰港_黑潮王座_V4.2_AI_GM主线状态机与支线条件版.md' \
                    '灰港_黑潮王座_V4.3_慢节奏条件驱动版.md' \
                    '灰港_黑潮王座_V4.3_新增支线扩展包.md' \
                    '灰港_当前权威剧本.md'
          git diff --cached --stat
          git commit -m 'Consolidate Gray Harbor scenario into V4.4'
          git push origin HEAD:main
